    environment:
      - CFST_N=200
      - CFST_T=4
      - CFST_DN=10
      - CFST_DT=10
      - CFST_TP=443
      - CFST_URL=https://cf.xiu2.xyz/url
      - CFST_TL=200
      - CFST_TLL=0
      - CFST_TLR=1.0
      - CFST_SL=5
      - CFST_DD=false
      - CFST_HTTPING=false
      - CFST_HTTPING_CODE=0
      - CFST_CFCOLO=
      - CFST_IP=
      - CFST_ALLIP=false
      - CFST_P=10
      - CFST_O=result_ipv6.csv
      - CFST_F=ipv6.txt
      - CFST_DEBUG=false
      - CFST_REPORT=
      - CFST_REPORT_ONLY=false
      - CFST_REPORT_FILE=
      - CFST_REPORT_PORT=443
      - CFST_REPORT_WORKER_DOMAIN=
      - CFST_REPORT_UUID=
      - CFST_REPORT_GITHUB_TOKEN=
      - CFST_REPORT_GITHUB_OWNER=
      - CFST_REPORT_GITHUB_REPO=
      - CFST_REPORT_GITHUB_BRANCH=main
      - CFST_REPORT_GITHUB_PATH=preferred_ips.txt
      - CFST_CRON=
      - CFST_CRON_ONCE=false
      - TZ=Asia/Shanghai
    volumes:
      - cfst:/app/cfst
      - ./ipv6.txt:/app/cfst/ipv6.txt:ro
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "2.0"
    #       memory: 512M
    #     reservations:
    #       cpus: "0.5"
    #       memory: 128M
    restart: "no"

  cfst-cron:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: v2.3.4
        TARGETARCH: amd64
        GOPROXY: https://goproxy.cn,direct
    image: cfst:latest
    container_name: cfst-cron
    network_mode: host
    profiles:
      - cron
    environment:
      - CFST_N=200
      - CFST_T=4
      - CFST_DN=10
      - CFST_DT=10
      - CFST_TP=443
      - CFST_URL=https://cf.xiu2.xyz/url
      - CFST_TL=200
      - CFST_TLL=0
      - CFST_TLR=1.0
      - CFST_SL=5
      - CFST_DD=false
      - CFST_HTTPING=false
      - CFST_HTTPING_CODE=0
      - CFST_CFCOLO=
      - CFST_IP=
      - CFST_ALLIP=false
      - CFST_P=10
      - CFST_O=result.csv
      - CFST_F=ip.txt
      - CFST_DEBUG=false
      - CFST_REPORT=cloudflare
      - CFST_REPORT_ONLY=false
      - CFST_REPORT_FILE=
      - CFST_REPORT_PORT=443
      - CFST_REPORT_WORKER_DOMAIN=
      - CFST_REPORT_UUID=
      - CFST_REPORT_GITHUB_TOKEN=
      - CFST_REPORT_GITHUB_OWNER=
      - CFST_REPORT_GITHUB_REPO=
      - CFST_REPORT_GITHUB_BRANCH=main
      - CFST_REPORT_GITHUB_PATH=preferred_ips.txt
      - CFST_CRON=0 2 * * *
      - CFST_CRON_ONCE=false
      - TZ=Asia/Shanghai
    volumes:
      - cfst:/app/cfst
      - ./ip.txt:/app/cfst/ip.txt:ro
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "2.0"
    #       memory: 512M
    #     reservations:
    #       cpus: "0.5"
    #       memory: 128M
    restart: unless-stopped

  cfst-arm64:
